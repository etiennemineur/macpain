<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MacPain — réplique bitmap de MacPaint 1.5</title>
<!-- All interface and document text uses embedded classic bitmap strikes. -->
<script src="touch-router.js"></script>
<style>
  :root { color-scheme: light; }
  html, body { margin: 0; height: 100%; background: #1b1b1b; }
  body {
    display: flex; align-items: center; justify-content: center;
    overflow: auto; -webkit-user-select: none; user-select: none;
    background: radial-gradient(circle at 50% 40%, #3a3a3a 0%, #1b1b1b 60%, #101010 100%);
  }
  #screen {
    position: absolute; left: 0; top: 0;
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: #fff;
    box-shadow: 0 0 0 2px #000, 0 18px 60px rgba(0,0,0,.65);
    touch-action: none;
  }
</style>
</head>
<body>
<canvas id="screen" width="512" height="342" aria-label="MacPain — réplique web de MacPaint 1.5"></canvas>
<input id="file" type="file" accept="image/*" hidden>
<script src="classic-data.js"></script>
<script src="satire.js"></script>
<script src="macpaint.js"></script>
</body>
</html>
